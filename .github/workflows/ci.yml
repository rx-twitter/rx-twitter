name: CI

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Cache node_modules
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

  gen-api-check:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline && npm run build:shared

      - name: Generate API clients
        run: npm run gen:api

      - name: Verify generated code is up to date
        run: |
          git add -N src/fxtwitter/generated src/vxtwitter/generated
          if ! git diff --exit-code -- src/fxtwitter/generated src/vxtwitter/generated; then
            echo "::error::生成物が最新ではありません。'npm run gen:api' を実行してコミットしてください"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build shared package
        # キャッシュされた dist が shared のソース変更に追従しないため、常に再ビルドする
        run: npm run build:shared

      - name: Run oxlint
        run: npx oxlint src/ tests/

      - name: Run oxfmt (format check)
        run: npx oxfmt --check src/

      - name: Type-check (compile gate)
        run: npm run compile:test

      - name: Type-check tests
        run: npm run compile:tests

      - name: Run all tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-redis:
    runs-on: ubuntu-latest
    needs: setup

    services:
      redis:
        image: redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build shared package
        run: npm run build:shared

      # tests/integration と tests/e2e のテストは全て明示フラグでゲートされて
      # いるため、ディレクトリ指定でよい。RUN_REDIS_INTEGRATION だけを立てるので、
      # 実 API を叩くテスト（RUN_LIVE_API_TESTS）は skipped のまま残る。
      # ファイル名を列挙しないことで、テスト追加時に CI への追記を忘れても
      # 実行対象から漏れない。
      - name: Run Redis integration and E2E tests
        run: npx vitest run tests/integration tests/e2e
        env:
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://localhost:6379

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: "npm"

      - name: Restore node_modules
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/shared/dist
          key: deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (fallback)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline && npm run build:shared

      - name: Build TypeScript
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful"

      # エイリアスの宣言は tsconfig の paths（コンパイル時）と package.json の
      # imports（実行時）に分かれている。片方だけ書き換えても型検査は通り、
      # 本番起動で初めて ERR_MODULE_NOT_FOUND になる。成果物側で解決を検証する。
      - name: Verify module resolution in build output
        run: npm run verify:dist
