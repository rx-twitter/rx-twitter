name: Publish @rx-twitter/shared

on:
  push:
    branches:
      - main
    paths:
      - "packages/shared/**"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com"
          scope: "@rx-twitter"

      - name: Install dependencies
        run: npm ci --workspace=@rx-twitter/shared

      - name: Build
        run: npm run build --workspace=@rx-twitter/shared

      - name: Publish to GitHub Packages
        run: npm publish --workspace=@rx-twitter/shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
